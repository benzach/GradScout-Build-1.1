<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3a405a" />

    <title>GradScout — Graduate &amp; entry-level jobs, found for you</title>
    <meta
      name="description"
      content="GradScout scans the UK's graduate job boards on a timer, merges duplicate listings, and matches what's left against your own saved search — with push notifications or a weekly email digest."
    />
    <link rel="canonical" href="https://www.gradscout.uk/" />

    <!-- Open Graph / Twitter — shown when a link to the site is shared
         on social platforms, Slack, iMessage, etc. Reuses the app's own
         icon-512.png as the preview image rather than a separate asset,
         since there's no dedicated marketing graphic yet; swap this for
         a proper 1200x630 image whenever one exists. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GradScout" />
    <meta property="og:title" content="GradScout — Graduate & entry-level jobs, found for you" />
    <meta
      property="og:description"
      content="One search, run continuously across the UK's graduate job boards — deduplicated, matched, and sent straight to you."
    />
    <meta property="og:url" content="https://www.gradscout.uk/" />
    <meta property="og:image" content="https://www.gradscout.uk/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="GradScout — Graduate & entry-level jobs, found for you" />
    <meta
      name="twitter:description"
      content="One search, run continuously across the UK's graduate job boards — deduplicated, matched, and sent straight to you."
    />
    <meta name="twitter:image" content="https://www.gradscout.uk/icon-512.png" />

    <!-- Favicons. PNG favicons are supported by every current browser —
         no separate .ico export needed alongside these. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- iOS treats "installed as a web app" as a distinct mode from
         "opened in Safari" — these three tags are what make it open
         full-screen and identify itself correctly once added to the
         home screen, and are also a prerequisite for push notifications
         to work on iOS at all. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GradScout" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
